name: Vérifications du site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier le HTML
        run: npx --yes htmlhint@1.9.2 --config .htmlhintrc '**/*.html'
      - name: Vérifier les chemins et liens internes
        if: ${{ !cancelled() }}
        run: python3 scripts/check_site.py
      - name: Installer les outils de test navigateur
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Installer Chromium pour les tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Tester le mobile, le clavier et l'accessibilité
        run: npm test
